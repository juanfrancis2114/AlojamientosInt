# Contrato propio de Kawsay Estancias. Revisar este contrato antes de cambiar el núcleo REST.
openapi: 3.0.3
info:
  title: Kawsay Estancias API — contrato propio
  version: 1.3.0
  description: "Contrato propio del dominio de alojamientos de Kawsay Estancias.
    Es la fuente de esquemas para validación AJV y documentación del núcleo
    REST. Conserva nombres de operaciones compatibles con la plantilla
    académica, con modelos y reglas del proyecto: Ecuador, USD, reservas sin
    solapamientos, código de reserva, JWT revocable, idempotencia y outbox. Las
    extensiones administrativas se documentan adicionalmente mediante DTO de
    NestJS. No hay cobros reales ni entrega automática de webhooks."
  x-origin: Diseñado para Kawsay Estancias; la plantilla se conserva por separado
    como referencia académica.
servers:
  - url: /api/v1
    description: API del despliegue desde el que se abre el contrato
  - url: https://booking-prototipo-alojamientos.vercel.app/api/v1
    description: Producción actual de Kawsay Estancias
security:
  - bearer: []
  - cookie: []
tags:
  - name: Alojamientos
  - name: Reservas
  - name: Identidad
  - name: Integración futura
x-business-rules:
  occupancy: Una reserva confirmada bloquea el alojamiento completo en [checkin,
    checkout).
  cancellation: Cancelar libera las noches. Se permite otra estancia desde la
    fecha de salida.
  currency: USD
  payment: Simulado; referencias DEMO-.
  authentication: JWT HS256 de una hora con sesión revocable. OAuth2 externo es futuro.
  outbox: Reserva y evento se guardan en la misma transacción. El worker de
    entrega es futuro.
paths:
  /search:
    post:
      operationId: post_search
      tags:
        - Alojamientos
      summary: Buscar estancias disponibles en Ecuador
      description: Una reserva confirmada bloquea todo el alojamiento para cualquiera
        durante las noches [checkin, checkout). Las reservas canceladas liberan
        las noches.
      security: []
      parameters:
        - name: X-Device-Fingerprint
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchAccommodationRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccommodationList"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /availability:
    post:
      operationId: post_availability
      tags:
        - Alojamientos
      summary: Consultar noches libres y precio calculado por el servidor
      description: Si hay solapamiento, available=false, available_rooms=0 y
        products=[]. Los productos disponibles vencen a los 15 minutos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /bulk-availability:
    post:
      operationId: post_bulk_availability
      tags:
        - Alojamientos
      summary: Consultar disponibilidad de varias estancias
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAvailabilityRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Availability"
                  next_page:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /details:
    post:
      operationId: post_details
      tags:
        - Alojamientos
      summary: Consultar información de alojamientos
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccommodationDetailsRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccommodationList"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /details/changes:
    post:
      operationId: post_details_changes
      tags:
        - Alojamientos
      summary: Consultar cambios de catálogo para sincronizar otro sistema
      description: ""
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetailsChangesRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date-time
                      next:
                        type: string
                        format: date-time
                      total_changes:
                        type: integer
                      changes:
                        type: object
                        properties:
                          accommodations:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  minimum: 1
                                updated_at:
                                  type: string
                                  format: date-time
                                published:
                                  type: boolean
                  next_page:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /constants:
    post:
      operationId: post_constants
      tags:
        - Alojamientos
      summary: Consultar catálogos y moneda admitida
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConstantsRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    type: object
                    properties: {}
                  next_page:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /chains:
    post:
      operationId: post_chains
      tags:
        - Alojamientos
      summary: Consultar catálogo preliminar de cadenas
      description: ""
      security: []
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    type: array
                    items:
                      type: object
                      properties: {}
                  next_page:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /reviews:
    post:
      operationId: post_reviews
      tags:
        - Alojamientos
      summary: Consultar reseñas públicas
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewsRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    type: array
                    items:
                      type: object
                      properties: {}
                  next_page:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /reviews/scores:
    post:
      operationId: post_reviews_scores
      tags:
        - Alojamientos
      summary: Consultar puntuaciones de alojamientos
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewsScoresRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    type: array
                    items:
                      type: object
                      properties: {}
                  next_page:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /orders/preview:
    post:
      operationId: post_orders_preview
      tags:
        - Reservas
      summary: Cotizar una reserva antes de confirmarla
      description: Solo viajeros. La cotización pertenece al usuario y vence a los 10
        minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPreviewRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /orders/create:
    post:
      operationId: post_orders_create
      tags:
        - Reservas
      summary: Confirmar reserva y obtener su código
      description: Revalida las noches dentro de la transacción. Guarda reserva,
        factura, respuesta idempotente y evento ORDER_CONFIRMED. El campo
        locator es el código de reserva. El pago es simulado.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUID v4. Repetir la misma clave y cuerpo devuelve la misma reserva;
            cambiar el cuerpo produce 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /orders:
    get:
      operationId: get_orders
      tags:
        - Reservas
      summary: Consultar Mis reservas
      description: ""
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationList"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /orders/{orderId}:
    get:
      operationId: get_orders__orderId_
      tags:
        - Reservas
      summary: Consultar una reserva propia o con rol administrador
      description: ""
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /orders/{orderId}/modify:
    post:
      operationId: post_orders__orderId__modify
      tags:
        - Reservas
      summary: Modificar fechas sin solaparse con otra reserva
      description: ""
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUID v4. Repetir la misma clave y cuerpo devuelve la misma reserva;
            cambiar el cuerpo produce 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderModifyRequest"
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /orders/{orderId}/cancel:
    post:
      operationId: post_orders__orderId__cancel
      tags:
        - Reservas
      summary: Cancelar y liberar las noches reservadas
      description: ""
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: UUID v4. Repetir la misma clave y cuerpo devuelve la misma reserva;
            cambiar el cuerpo produce 409.
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /auth/register:
    post:
      operationId: post_auth_register
      tags:
        - Identidad
      summary: Crear una cuenta de viajero
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /auth/login:
    post:
      operationId: post_auth_login
      tags:
        - Identidad
      summary: Iniciar sesión con JWT y cookie HttpOnly
      description: ""
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /auth/me:
    get:
      operationId: get_auth_me
      tags:
        - Identidad
      summary: Consultar la identidad autenticada
      description: ""
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /auth/session:
    get:
      operationId: get_auth_session
      tags:
        - Identidad
      summary: Consultar la sesión al abrir la web, incluso como visitante
      description: Devuelve HTTP 200 con user=null cuando no hay sesión válida. Una
        sesión válida devuelve su identidad. No concede acceso a operaciones
        protegidas, que siguen devolviendo 401 o 403 según corresponda.
      security: []
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /auth/logout:
    post:
      operationId: post_auth_logout
      tags:
        - Identidad
      summary: Cerrar sesión y revocar el token
      description: ""
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /admin/erp/usuarios:
    post:
      operationId: post_admin_erp_usuarios
      tags:
        - Identidad
      summary: Crear un usuario o un administrador desde una cuenta administradora
      description: "Solo un administrador activo puede crear usuarios administrativos.
        Sin sesión: 401. Un viajero: 403. La cuenta del actor y su rol actual se
        vuelven a comprobar dentro de la transacción. El registro público asigna
        siempre customer. La operación queda en auditoría y nunca devuelve la
        contraseña ni su hash."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserView"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "401":
          $ref: "#/components/responses/ProblemDetails401"
        "403":
          $ref: "#/components/responses/ProblemDetails403"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /catalog:
    get:
      operationId: get_catalog
      tags:
        - Alojamientos
      summary: Consultar catálogo público
      description: ""
      security: []
      parameters:
        - name: nombre
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccommodationList"
        "400":
          $ref: "#/components/responses/ProblemDetails400"
        "409":
          $ref: "#/components/responses/ProblemDetails409"
  /catalog/{id}:
    get:
      operationId: get_catalog__id_
      tags:
        - Alojamientos
      summary: Consultar un alojamiento publicado
      description: ""
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Operación completada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - request_id
                  - data
                  - next_page
                properties:
                  request_id:
                    type: string
                    format: uuid
                  data:
                    $ref: "#/components/schemas/Accommodation"
